name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ${{ vars.LOCAL_CI_ENABLED == 'true' && fromJSON('["self-hosted","linux","x64","omarchy-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - parallel:
          - name: Check dependencies
            run: pnpm check:deps

          - name: Typecheck
            run: pnpm typecheck

          - name: Lint
            run: pnpm lint && pnpm format:check

          - name: Test
            run: pnpm test

          - name: Scene smoke test
            run: node scripts/scene-smoke.ts > /dev/null

          - name: Build and check bundle
            run: pnpm check:bundle
